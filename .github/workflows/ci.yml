name: CI/CD Dashboard

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || 'ghcr.io/dsql-mongkey' }}
  IMAGE: ${{ vars.IMAGE_PREFIX || 'ghcr.io/dsql-mongkey' }}/jiandco-dashboard
  HUSKY: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://dash.jiandco.id
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://dash.jiandco.id
            NEXT_PUBLIC_API_URL=https://api.jiandco.id
            INTERNAL_API_URL=http://jiandco-api:8080
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: jiandco-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy dashboard
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.VPS_APP_DIR || '/opt/jiandco' }}"
            flock /tmp/jiandco-deploy.lock -c '
              sed -i "s|^DASHBOARD_TAG=.*|DASHBOARD_TAG=${{ github.sha }}|" .env
              grep -q "^DASHBOARD_TAG=" .env || echo "DASHBOARD_TAG=${{ github.sha }}" >> .env
              docker compose pull jiandco-dashboard
              docker compose up -d --wait jiandco-dashboard
            '
            docker image prune -f --filter until=168h
